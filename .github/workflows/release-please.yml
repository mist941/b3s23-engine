name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

      # Tags created with GITHUB_TOKEN don't fire `push: tags:` workflows,
      # so the docker build must be dispatched explicitly.
      - name: Dispatch docker workflow for release tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh workflow run docker.yml
          --repo "${{ github.repository }}"
          --ref "${{ steps.release.outputs.tag_name }}"
