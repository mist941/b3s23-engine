name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: engine/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The race detector needs cgo + a C toolchain, which the Linux runner has
      # (the production binary itself is still built CGO-free).
      - name: Test (race detector)
        run: go test -race ./...

      - name: Static build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/engined
